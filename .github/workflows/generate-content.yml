name: Weekly Content Generation

# Run Tuesday morning in Toronto and prepare Wednesday through Tuesday.
# 09:00 UTC is 4am EST / 5am EDT, safely after Tuesday's 3am game reset.
on:
  schedule:
    - cron: '0 9 * * 2'
  workflow_dispatch:
    inputs:
      offset:
        description: 'Days from today to start (use 0 to fill missing content now)'
        required: true
        default: '0'

permissions:
  contents: read

concurrency:
  group: weekly-content-generation
  cancel-in-progress: false

jobs:
  generate-weekly-content:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install script dependencies
        working-directory: scripts
        run: npm ci

      - name: Generate weekly content
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GENERATION_OFFSET: ${{ github.event_name == 'schedule' && '1' || inputs.offset }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo 'FIREBASE_SERVICE_ACCOUNT repository secret is not configured.' >&2
            exit 1
          fi
          node generate-week.js --auto-approve --offset="$GENERATION_OFFSET"
